name: Build and Push Docker Image

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - '**'  # Run checks on all branches when a PR is created

jobs:
  
  build-and-push:
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - uses: st4rchaser/jerm-action@v6.4.0

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v3
        with:
          path: |
            .bun
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Set Docker tag
        id: docker_tag
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "TAG=latest-dev" >> $GITHUB_ENV
          else
            echo "TAG=latest" >> $GITHUB_ENV
          fi

      - name: Build Docker image
        run: |
          docker buildx build . \
            --platform linux/amd64,linux/arm64 \
            -t bunnybunbun37204/cusw-backend:${{ env.TAG }} \
            --push

  code-check:
    if: github.event_name == 'pull_request' && github.base_ref != 'dev' && github.base_ref != 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'

      - name: Verify Bun installation
        run: bun --version

      - name: Install dependencies
        run: bun install

      - name: Lint code
        run: |
          echo "Running lint checks..."
          bun run lint

      - name: Unit test
        run: |
          echo "Running unit tests..."
          bun test --coverage
